<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cute Dog</title>
<style>
  :root { --bg:#fdf1dc; --bg2:#f9d9a8; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(circle at 50% 40%, var(--bg), var(--bg2));
    font-family: system-ui, sans-serif;
  }
  svg { width: min(80vmin, 520px); height: auto; overflow: visible; }
  .hint { position: fixed; bottom: 20px; width: 100%; text-align: center; color: #a47a45; font-size: 14px; }
  #tail { transform-origin: 300px 410px; animation: wag .5s ease-in-out infinite alternate; }
  @keyframes wag { from { transform: rotate(-14deg); } to { transform: rotate(16deg); } }
  #head { animation: bob 3s ease-in-out infinite; transform-origin: 250px 400px; }
  @keyframes bob { 50% { transform: translateY(-4px) rotate(1deg); } }
  #lids { animation: blink 4s infinite; transform-origin: center; }
  @keyframes blink { 0%, 94%, 100% { opacity: 0; } 96%, 98% { opacity: 1; } }
  #tongue { animation: pant 1s ease-in-out infinite alternate; transform-origin: 250px 318px; }
  @keyframes pant { to { transform: scaleY(1.12); } }
  svg { cursor: pointer; }
  #head.barking { animation: jump .35s ease-out; }
  @keyframes jump { 30% { transform: translateY(-16px) scale(1.04); } 100% { transform: none; } }
  #woof.show { animation: pop .8s ease-out; }
  @keyframes pop { 0% { opacity: 0; transform: scale(.5); transform-origin: 405px 130px; }
    15%, 70% { opacity: 1; transform: scale(1); transform-origin: 405px 130px; } 100% { opacity: 0; } }
</style>
</head>
<body>
<svg viewBox="0 0 500 500" aria-label="A cute dog whose eyes follow the cursor">
  <ellipse cx="250" cy="468" rx="130" ry="14" fill="#000" opacity=".1"/>

  <ellipse cx="250" cy="430" rx="48" ry="40" fill="#fbe6c4"/>

    <ellipse cx="244" cy="283" rx="6" ry="3.5" fill="#fff" opacity=".6"/>

      <path id="tongue" d="M236 324 Q250 366 264 324 Z" fill="#f2788a"/>
    </g>
    <g id="bark-mouth" style="display:none">
      <path d="M250 302 L250 310 M250 310 Q215 306 212 330 Q214 372 250 374 Q286 372 288 330 Q285 306 250 310Z" fill="#5a1f2a" stroke="#2b1a10" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M226 352 Q250 330 274 352 Q262 372 250 372 Q238 372 226 352Z" fill="#f2788a"/>
    </g>
  </g>
  <g id="woof" opacity="0">
    <path d="M345 90 h120 a14 14 0 0 1 14 14 v44 a14 14 0 0 1 -14 14 h-70 l-22 22 l4 -22 h-32 a14 14 0 0 1 -14 -14 v-44 a14 14 0 0 1 14 -14z" fill="#fff" stroke="#c98a4b" stroke-width="4"/>
    <text x="405" y="143" text-anchor="middle" font-size="36" font-weight="800" fill="#8a5528" font-family="system-ui, sans-serif">WOOF!</text>
  </g>
</svg>
<div class="hint">Move your cursor around, click to make it bark 🐶</div>

<script>
  const pupils = [...document.querySelectorAll('.pupil')];
  const svg = document.querySelector('svg');
  const MAX = 11; // max pupil travel in SVG units
  let tx = null, ty = null;

  function look(x, y) {
    const r = svg.getBoundingClientRect();
    const k = 500 / r.width;
    for (const p of pupils) {
      const cx = +p.dataset.cx, cy = +p.dataset.cy;
      const dx = (x - r.left) * k - cx, dy = (y - r.top) * k - cy;
      const d = Math.hypot(dx, dy) || 1;
      const m = Math.min(MAX, d / 8);
      p.setAttribute('transform', `translate(${cx + dx / d * m} ${cy + dy / d * m})`);
    }
  }

  function barkSound() {
    const a = barkAudio.cloneNode();
    a.play().catch(() => {});
  }

  const head = document.getElementById('head');
  const smile = document.getElementById('smile');
  const mouth = document.getElementById('bark-mouth');
  const woof = document.getElementById('woof');
  let timer;
  function bark() {
    try { barkSound(); } catch (e) {}
    smile.style.display = 'none'; mouth.style.display = '';
    head.classList.remove('barking'); woof.classList.remove('show');
    void head.getBoundingClientRect(); // restart animations on rapid clicks
    head.classList.add('barking'); woof.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(() => { smile.style.display = ''; mouth.style.display = 'none'; }, 280);
  }
  addEventListener('pointerdown', bark);

  look(innerWidth / 2, innerHeight / 2 + 200);
  addEventListener('pointermove', e => { tx = e.clientX; ty = e.clientY; look(tx, ty); });
  addEventListener('resize', () => tx !== null && look(tx, ty));
