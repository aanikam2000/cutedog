<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cute Dog</title>
<style>
  :root { --bg:#fdf1dc; --bg2:#f9d9a8; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(circle at 50% 40%, var(--bg), var(--bg2));
    font-family: system-ui, sans-serif;
  }
  svg { width: min(80vmin, 520px); height: auto; overflow: visible; }
  .hint { position: fixed; bottom: 20px; width: 100%; text-align: center; color: #a47a45; font-size: 14px; }
  #tail { transform-origin: 300px 410px; animation: wag .5s ease-in-out infinite alternate; }
  @keyframes wag { from { transform: rotate(-14deg); } to { transform: rotate(16deg); } }
  #head { animation: bob 3s ease-in-out infinite; transform-origin: 250px 400px; }
  @keyframes bob { 50% { transform: translateY(-4px) rotate(1deg); } }
  #lids { animation: blink 4s infinite; transform-origin: center; }
  @keyframes blink { 0%, 94%, 100% { opacity: 0; } 96%, 98% { opacity: 1; } }
  #tongue { animation: pant 1s ease-in-out infinite alternate; transform-origin: 250px 318px; }
  @keyframes pant { to { transform: scaleY(1.12); } }
  svg { cursor: pointer; }
  #head.barking { animation: jump .35s ease-out; }
  @keyframes jump { 30% { transform: translateY(-16px) scale(1.04); } 100% { transform: none; } }
  #woof.show { animation: pop .8s ease-out; }
  @keyframes pop { 0% { opacity: 0; transform: scale(.5); transform-origin: 405px 130px; }
    15%, 70% { opacity: 1; transform: scale(1); transform-origin: 405px 130px; } 100% { opacity: 0; } }
</style>
</head>
<body>
<svg viewBox="0 0 500 500" aria-label="A cute dog whose eyes follow the cursor">
  <ellipse cx="250" cy="468" rx="130" ry="14" fill="#000" opacity=".1"/>
  <!-- tail -->
  <g id="tail"><path d="M300 410 Q360 380 350 320" stroke="#c98a4b" stroke-width="26" fill="none" stroke-linecap="round"/></g>
  <!-- body -->
  <ellipse cx="250" cy="415" rx="82" ry="58" fill="#d99a58"/>
  <ellipse cx="250" cy="430" rx="48" ry="40" fill="#fbe6c4"/>
  <ellipse cx="205" cy="462" rx="24" ry="14" fill="#fbe6c4"/>
  <ellipse cx="295" cy="462" rx="24" ry="14" fill="#fbe6c4"/>

  <g id="head">
    <!-- ears -->
    <path d="M150 190 Q95 200 108 305 Q150 330 178 250 Z" fill="#8a5528"/>
    <path d="M350 190 Q405 200 392 305 Q350 330 322 250 Z" fill="#8a5528"/>
    <!-- head -->
    <ellipse cx="250" cy="250" rx="115" ry="105" fill="#e8aa63"/>
    <!-- face blaze -->
    <path d="M250 150 Q290 190 285 260 L215 260 Q210 190 250 150Z" fill="#fbe6c4"/>
    <ellipse cx="250" cy="300" rx="62" ry="48" fill="#fbe6c4"/>
    <!-- cheeks -->
    <circle cx="165" cy="295" r="17" fill="#f5a3a3" opacity=".55"/>
    <circle cx="335" cy="295" r="17" fill="#f5a3a3" opacity=".55"/>
    <!-- eyes -->
    <circle cx="200" cy="240" r="30" fill="#fff"/>
    <circle cx="300" cy="240" r="30" fill="#fff"/>
    <g id="pupils">
      <g class="pupil" data-cx="200" data-cy="240">
        <circle r="17" fill="#2b1a10"/><circle cx="-5" cy="-6" r="6" fill="#fff"/><circle cx="6" cy="6" r="2.5" fill="#fff"/>
      </g>
      <g class="pupil" data-cx="300" data-cy="240">
        <circle r="17" fill="#2b1a10"/><circle cx="-5" cy="-6" r="6" fill="#fff"/><circle cx="6" cy="6" r="2.5" fill="#fff"/>
      </g>
    </g>
    <g id="lids" fill="#e8aa63"><circle cx="200" cy="240" r="31"/><circle cx="300" cy="240" r="31"/></g>
    <!-- brows -->
    <path d="M172 200 Q200 188 226 200" stroke="#8a5528" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M274 200 Q300 188 328 200" stroke="#8a5528" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- nose & mouth -->
    <ellipse cx="250" cy="288" rx="20" ry="14" fill="#2b1a10"/>
    <ellipse cx="244" cy="283" rx="6" ry="3.5" fill="#fff" opacity=".6"/>
    <g id="smile">
      <path d="M250 302 L250 316 M250 316 Q232 334 214 316 M250 316 Q268 334 286 316" stroke="#2b1a10" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path id="tongue" d="M236 324 Q250 366 264 324 Z" fill="#f2788a"/>
    </g>
    <g id="bark-mouth" style="display:none">
      <path d="M250 302 L250 310 M250 310 Q215 306 212 330 Q214 372 250 374 Q286 372 288 330 Q285 306 250 310Z" fill="#5a1f2a" stroke="#2b1a10" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M226 352 Q250 330 274 352 Q262 372 250 372 Q238 372 226 352Z" fill="#f2788a"/>
    </g>
  </g>
  <g id="woof" opacity="0">
    <path d="M345 90 h120 a14 14 0 0 1 14 14 v44 a14 14 0 0 1 -14 14 h-70 l-22 22 l4 -22 h-32 a14 14 0 0 1 -14 -14 v-44 a14 14 0 0 1 14 -14z" fill="#fff" stroke="#c98a4b" stroke-width="4"/>
    <text x="405" y="143" text-anchor="middle" font-size="36" font-weight="800" fill="#8a5528" font-family="system-ui, sans-serif">WOOF!</text>
  </g>
</svg>
<div class="hint">Move your cursor around, click to make it bark 🐶</div>

<script>
  const pupils = [...document.querySelectorAll('.pupil')];
  const svg = document.querySelector('svg');
  const MAX = 11; // max pupil travel in SVG units
  let tx = null, ty = null;

  function look(x, y) {
    const r = svg.getBoundingClientRect();
    const k = 500 / r.width;
    for (const p of pupils) {
      const cx = +p.dataset.cx, cy = +p.dataset.cy;
      const dx = (x - r.left) * k - cx, dy = (y - r.top) * k - cy;
      const d = Math.hypot(dx, dy) || 1;
      const m = Math.min(MAX, d / 8);
      p.setAttribute('transform', `translate(${cx + dx / d * m} ${cy + dy / d * m})`);
    }
  }
  // Synthesized bark: a short noisy, pitch-dropping burst (no audio file needed)
  let ctx;
  function barkSound() {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    const t = ctx.currentTime;
    const out = ctx.createGain();
    out.gain.setValueAtTime(0.0001, t);
    out.gain.exponentialRampToValueAtTime(0.7, t + 0.02);
    out.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    const filt = ctx.createBiquadFilter();
    filt.type = 'bandpass'; filt.Q.value = 2;
    filt.frequency.setValueAtTime(900, t);
    filt.frequency.exponentialRampToValueAtTime(500, t + 0.2);
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(420, t);
    osc.frequency.exponentialRampToValueAtTime(190, t + 0.2);
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.25, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.5;
    const noise = ctx.createBufferSource(); noise.buffer = buf;
    osc.connect(filt); noise.connect(filt); filt.connect(out); out.connect(ctx.destination);
    osc.start(t); noise.start(t); osc.stop(t + 0.25); noise.stop(t + 0.25);
  }

  const head = document.getElementById('head');
  const smile = document.getElementById('smile');
  const mouth = document.getElementById('bark-mouth');
  const woof = document.getElementById('woof');
  let timer;
  function bark() {
    try { barkSound(); } catch (e) {}
    smile.style.display = 'none'; mouth.style.display = '';
    head.classList.remove('barking'); woof.classList.remove('show');
    void head.getBoundingClientRect(); // restart animations on rapid clicks
    head.classList.add('barking'); woof.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(() => { smile.style.display = ''; mouth.style.display = 'none'; }, 280);
  }
  addEventListener('pointerdown', bark);

  look(innerWidth / 2, innerHeight / 2 + 200);
  addEventListener('pointermove', e => { tx = e.clientX; ty = e.clientY; look(tx, ty); });
  addEventListener('resize', () => tx !== null && look(tx, ty));
</script>
</body>
</html>
